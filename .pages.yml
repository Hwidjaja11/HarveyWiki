media:
  input: docs/images
  output: images
content:
  - name: wiki_pages
    label: Wiki Pages
    type: collection
    path: docs
    extension: md
    fields:
      - {name: title, label: Page Title, type: string}
      - {name: subtitle, label: Page Subtitle / Short Description, type: string, required: false}
      - {name: date, label: Last Updated Date, type: date, required: false}
      - {name: categories, label: Article Categories / Tags, type: list, required: false}
      - {name: body, label: Article Content Canvas, type: rich-text}
