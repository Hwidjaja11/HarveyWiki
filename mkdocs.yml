site_name: HarveyWiki
theme:
  name: material
  icon:
    logo: material/book-open-page-variant
  font: false
  palette:
    primary: white
    accent: blue
  features:
    - navigation.sections
    - navigation.expand
    - toc.integrate

markdown_extensions:
  - pymdownx.details
  - pymdownx.superfences
  - admonition
plugins:
  - search

extra_css:
  - stylesheets/extra.css
