site_name: HarveyWiki
theme:
  name: material
  favicon: logo.png
  logo: logo.png
  font: false
  palette:
    primary: white
    accent: blue
  features:
    - navigation.sections
    - navigation.expand
    - toc.integrate

markdown_extensions:
  - pymdownx.details
  - pymdownx.superfences
  - admonition
plugins:
  - search
  - awesome-pages

extra_css:
  - stylesheets/extra.css
